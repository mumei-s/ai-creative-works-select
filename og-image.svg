    <text x="0" y="31" font-size="11" letter-spacing="4" fill="#bdb7ca" font-family="Arial,Helvetica,sans-serif">ON NOTE</text>
    <line x1="0" y1="55" x2="154" y2="55" stroke="#7df6ff" stroke-width="2"/>
    <path d="M154 55 L139 47 M154 55 L139 63" fill="none" stroke="#7df6ff" stroke-width="2"/>
