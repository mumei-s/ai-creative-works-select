<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="0.52" stop-color="#130d2c"/>
      <stop offset="1" stop-color="#07131c"/>
    </linearGradient>
    <radialGradient id="g1" cx="76%" cy="22%" r="46%">
      <stop offset="0" stop-color="#a86cff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#a86cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="89%" cy="68%" r="40%">
      <stop offset="0" stop-color="#62efff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#62efff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="18%" cy="84%" r="34%">
      <stop offset="0" stop-color="#ff5dc8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5dc8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7df6ff"/>
      <stop offset="0.47" stop-color="#b58cff"/>
      <stop offset="1" stop-color="#ff7bd4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#g3)"/>

  <circle cx="998" cy="118" r="122" fill="#8c5cff" opacity="0.18" filter="url(#soft)"/>
  <circle cx="1080" cy="472" r="110" fill="#65f0ff" opacity="0.12" filter="url(#soft)"/>

  <g transform="translate(66 58)">
