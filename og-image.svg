    <text x="0" y="98" font-size="102" font-weight="900" letter-spacing="-6" fill="url(#title)" filter="url(#glow)" font-family="Arial,Helvetica,sans-serif">AI CREATIVE</text>
    <text x="0" y="196" font-size="118" font-weight="900" letter-spacing="-7" fill="#ffffff" font-family="Arial,Helvetica,sans-serif">WORKS</text>
    <text x="4" y="244" font-size="20" font-weight="600" letter-spacing="1" fill="#ddd9e8" font-family="Arial,'Noto Sans JP',sans-serif">AIイラスト・AI動画・AI Music・Prompt・制作メモが交差する共同マガジン。</text>
  </g>

  <g transform="translate(66 520)" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">
    <g><rect width="128" height="40" rx="20" fill="#122334" stroke="#62efff" stroke-opacity="0.45"/><text x="64" y="25" text-anchor="middle" fill="#7df6ff">AI Visual</text></g>
    <g transform="translate(140 0)"><rect width="128" height="40" rx="20" fill="#122334" stroke="#62efff" stroke-opacity="0.45"/><text x="64" y="25" text-anchor="middle" fill="#7df6ff">AI Video</text></g>
    <g transform="translate(280 0)"><rect width="128" height="40" rx="20" fill="#25152c" stroke="#ff7bd4" stroke-opacity="0.45"/><text x="64" y="25" text-anchor="middle" fill="#ff93da">AI Music</text></g>
    <g transform="translate(420 0)"><rect width="178" height="40" rx="20" fill="#2a2410" stroke="#ffe86e" stroke-opacity="0.45"/><text x="89" y="25" text-anchor="middle" fill="#ffe86e">Prompt &amp; Making</text></g>
    <g transform="translate(610 0)"><rect width="138" height="40" rx="20" fill="#17280f" stroke="#a9ff52" stroke-opacity="0.45"/><text x="69" y="25" text-anchor="middle" fill="#baff70">Experiment</text></g>
    <g transform="translate(760 0)"><rect width="128" height="40" rx="20" fill="#2c1c13" stroke="#ff9d5b" stroke-opacity="0.45"/><text x="64" y="25" text-anchor="middle" fill="#ffb080">Creators</text></g>
  </g>

  <g transform="translate(952 448)">
