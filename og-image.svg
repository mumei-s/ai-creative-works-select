    <circle cx="48" cy="48" r="34" fill="#1b1532" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="48" y="59" text-anchor="middle" font-size="29" font-weight="800" fill="#ffffff" font-family="Arial,Helvetica,sans-serif">A/C</text>
    <text x="118" y="36" font-size="20" font-weight="700" letter-spacing="6" fill="#f8f6ff" font-family="Arial,Helvetica,sans-serif">AI CREATIVE WORKS</text>
    <text x="118" y="65" font-size="11" letter-spacing="4" fill="#bcb7cc" font-family="Arial,Helvetica,sans-serif">MAGAZINE &amp; CREATOR SHOWCASE</text>
